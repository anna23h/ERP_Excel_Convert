<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运单扫码回流</title>
<style>
  :root { --ok:#1a7f37; --bad:#c0261a; --warn:#c47f17; --idle:#1f2733; --ink:#f5f7fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink); background: var(--idle);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    transition: background .08s;
  }
  body.state-ok   { background: var(--ok); }
  body.state-bad  { background: var(--bad); }
  body.state-warn { background: var(--warn); }

  /* 顶栏：常驻计数 + 时钟 + 店 */
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 1.5rem;
    padding: .6rem 1.2rem; background: rgba(0,0,0,.28); font-size: clamp(15px, 2.2vw, 26px);
  }
  #bar .grow { flex: 1; }
  #count { font-weight: 800; font-size: clamp(20px, 3.2vw, 40px); }
  #count small { font-weight: 400; opacity: .8; font-size: .55em; }
  #unknown { font-weight: 700; padding: .1em .5em; border: 2px solid rgba(255,255,255,.5); border-radius: 6px; opacity: .75; }
  #unknown.hot { background: var(--warn); border-color: rgba(255,255,255,.9); opacity: 1; }
  #clock { font-variant-numeric: tabular-nums; }
  #storg { font-weight: 700; padding: .1em .5em; border-radius: 6px; }
  #storg.warn { background: var(--warn); }
  #storg.bad  { background: var(--bad); }

  /* 主状态区：满屏大字 */
  #stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 1rem; gap: .4rem;
  }
  #big { font-size: clamp(48px, 12vw, 180px); font-weight: 900; line-height: 1; }
  #seq { font-size: clamp(30px, 8vw, 120px); font-weight: 800; letter-spacing: .02em; }
  #detail { font-size: clamp(18px, 3.5vw, 44px); font-weight: 600; word-break: break-all; opacity: .96; }
  #sub { font-size: clamp(14px, 2.2vw, 26px); opacity: .85; word-break: break-all; }

  /* 底栏：载入 / 导出 / 最近记录 */
  #foot {
    flex: 0 0 auto; background: rgba(0,0,0,.28); padding: .5rem 1rem;
    display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; font-size: 14px;
  }
  #foot .grow { flex: 1; }
  button, label.filebtn {
    font: inherit; font-size: 15px; padding: .45em .9em; border-radius: 8px; border: 0;
    background: rgba(255,255,255,.92); color: #111; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #recent { display: flex; gap: .4rem; overflow-x: auto; max-width: 100%; }
  #recent span { white-space: nowrap; padding: .1em .5em; border-radius: 5px; background: rgba(0,0,0,.35); }
  #recent span.r-bad { background: rgba(255,255,255,.9); color: var(--bad); font-weight: 700; }
  input[type=file] { display: none; }
  #note { font-size: 13px; opacity: .8; }
  kbd { background: rgba(0,0,0,.4); padding: 0 .35em; border-radius: 4px; font-size: .9em; }

  /* 分批清点：顶栏本批进度 */
  #cpprog { font-weight: 700; padding: .1em .5em; border: 2px solid rgba(255,255,255,.5); border-radius: 6px; opacity: .75; }
  #cpprog.hot { background: var(--bad); border-color: rgba(255,255,255,.9); opacity: 1; }
  /* 分批清点：本批分段进度条（N 个格子，每扫一件亮一格；数亮格=当前 x/N）*/
  #cpbar { flex: 0 0 auto; display: flex; gap: 3px; padding: 5px 10px; background: rgba(0,0,0,.28); }
  #cpbar[hidden] { display: none; }
  #cpbar .seg { flex: 1; height: 14px; border-radius: 3px; background: rgba(255,255,255,.16); transition: background .1s; }
  #cpbar .seg.on   { background: var(--ink); }                 /* 已扫入本批 */
  /* 分批清点：底栏配置 */
  #cpcfg { display: flex; align-items: center; gap: .3rem; font-size: 14px; opacity: .9; }
  #cpcfg.off { opacity: .45; }
  #cpcfg input[type=number] { width: 3.2em; font: inherit; padding: .15em .3em; border-radius: 5px; border: 0; text-align: center; }
  /* 分批清点：检查点浮层（全屏，须点击才继续；扫码期间暂停）*/
  #cp {
    position: fixed; inset: 0; z-index: 50; background: var(--warn);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 1rem; gap: 1rem;
  }
  #cp[hidden] { display: none; }
  #cp .cp-big { font-size: clamp(40px, 10vw, 150px); font-weight: 900; line-height: 1; }
  #cp .cp-sub { font-size: clamp(18px, 3.5vw, 40px); font-weight: 600; word-break: break-all; }
  #cp .cp-btns { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; margin-top: .6rem; }
  #cp button { font-size: clamp(18px, 3vw, 34px); padding: .6em 1.4em; border-radius: 12px; font-weight: 800; }
  #cp .cp-ok  { background: var(--ok);  color: #fff; }
  #cp .cp-bad { background: #fff; color: var(--bad); }
</style>
</head>
<body class="state-idle">
  <div id="bar">
    <span id="count">已扫 0 <small>/ 0 单</small></span>
    <span id="unknown">未知来源 0</span>
    <span id="cpprog" hidden></span>
    <span id="storg" hidden></span>
    <span class="grow"></span>
    <span id="clock">--:--:--</span>
  </div>

  <div id="cpbar" hidden></div>

  <div id="stage">
    <div id="big">载入清单</div>
    <div id="seq"></div>
    <div id="detail">点击下方「载入扫码清单」，选今天的 <b>扫码清单{店}.csv</b>（<b>可多选/多次</b>，两店可一起载入）</div>
    <div id="sub">扫码枪需配「回车(Enter)后缀」并使用<b>实时传输</b>模式</div>
  </div>

  <div id="foot">
    <label class="filebtn">载入扫码清单<input type="file" id="file" accept=".csv,text/csv" multiple></label>
    <button id="export" disabled>导出有货清单</button>
    <button id="reset" disabled>清空今日</button>
    <span id="cpcfg">分批清点 每 <input type="number" id="cpn" min="1" value="10"> 件 <input type="checkbox" id="cptoggle" checked></span>
    <span id="note"></span>
    <span class="grow"></span>
    <div id="recent"></div>
  </div>

  <!-- 分批清点检查点浮层：每扫满 N 件弹出，须点击一个按钮才能继续扫 -->
  <div id="cp" hidden>
    <div class="cp-big" id="cpbig">清点这一批</div>
    <div class="cp-sub" id="cpsub">应为 <b>10</b> 件，数一下刚才这一摞，对上再继续</div>
    <div class="cp-btns">
      <button class="cp-ok"  id="cpok">✓ 对上了</button>
      <button class="cp-bad" id="cpbad">⚠ 对不上</button>
    </div>
  </div>

<script>
"use strict";
// —— 运单扫码回流（单文件，零依赖）——
// 载入 stage1 产出的 `扫码清单{店}.csv` 作封闭白名单；扫 LP(=Tracking) 校验三态：
//   清单内+首次 → 绿 + 确认音 + 记录 ; 清单内+重复 → 红 + 报警 + 拒绝 ; 不在清单 → 红 + 报警 + 拒绝
// 声音为主异常通道；红色状态挂到下一次成功扫描。收工导出 `有货清单{店}.csv` 投 stage2「有货订单清单」入口。

const $ = id => document.getElementById(id);
const body = document.body;

let whitelist = new Map();   // 归一化 Tracking(LP) -> { ref, seq, track, store }（多店合并）
let scanned = new Map();     // 命中白名单的已扫 Tracking -> { ref, seq, track, store, at }（=各店有货集合）
let offlist = new Map();     // 名单外(未知来源)已扫 LP -> { track, at }（黄屏记录，单独导出）
let buf = "";                // 扫码枪逐字符缓冲
let lastKeyTs = 0;

// —— 分批清点：每扫满 N 件停一次，把「收工清点」拆进扫描过程，把误差定位范围从全天缩到 N ——
let cpEnabled = true;        // 默认开启（可在底栏关闭）
let cpN = 10;               // 每批件数；与打包员定的物理单元容量对齐（现场核验后可在页面上改）
let cpSince = 0;            // 距上次检查点已成功扫入的件数（只计绿色，重复/未知来源不计）
let cpLog = [];            // 检查点记录 [{idx,at,size,result:'ok'|'mismatch',final}]，供刷新恢复与收工复盘
let cpActive = false;      // 浮层展示中 → 扫码暂停，让操作员专心清点
let cpCur = null;         // 当前浮层 { size, final }
let cpPending = null;     // 收尾检查点（收工导出触发）ack 后要执行的回调

// —— 声音（WebAudio，避免任何外部文件；首次用户手势解锁）——
let ac = null;
function unlockAudio() { if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === "suspended") ac.resume(); }
function tone(freq, ms, type, gain) {
  if (!ac) return;
  const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.25, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms/1000);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + ms/1000 + 0.02);
}
function beepOK()   { tone(1046, 110, "sine", 0.3); }                       // 短促清亮确认音
function beepBad()  { tone(220, 260, "square", 0.32); setTimeout(()=>tone(180, 340, "square", 0.32), 200); } // 低沉双响报警
function beepWarn() { tone(700, 120, "sine", 0.3); setTimeout(()=>tone(990, 150, "sine", 0.3), 120); }       // 上行双音「已记录·留意」（区别于绿/红）
function beepCP()   { tone(880, 150, "triangle", 0.3); setTimeout(()=>tone(660, 200, "triangle", 0.3), 160); } // 下行双音「停下清点」（区别于绿/黄/红）

// —— 时钟 ——
function tick() { const d = new Date(); $("clock").textContent = d.toTimeString().slice(0,8); }
setInterval(tick, 1000); tick();

// —— 归一化 ——
const norm = s => String(s == null ? "" : s).trim().toUpperCase();
const isLP = s => /^LP\d+$/.test(s);          // LP 结构（LP+数字）；不匹配=非 LP 格式

// —— CSV 解析（简单：本文件字段无逗号/引号，按行列切；剥 utf-8-sig BOM）——
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  if (!lines.length) return { rows: [], header: [] };
  const header = lines[0].split(",").map(h => h.trim());
  const rows = lines.slice(1).map(l => {
    const c = l.split(","); const o = {};
    header.forEach((h, i) => o[h] = (c[i] || "").trim());
    return o;
  });
  return { rows, header };
}

function colOf(header, names) {   // 容错找列名
  for (const n of names) { const h = header.find(x => x === n); if (h) return h; }
  const low = names.map(n => n.toLowerCase());
  return header.find(x => low.includes(x.toLowerCase()));
}

// —— 状态展示 ——
function setState(kind, big, seq, detail, sub) {
  body.className = "state-" + kind;
  $("big").textContent = big;
  $("seq").textContent = seq || "";
  $("detail").innerHTML = detail || "";
  $("sub").textContent = sub || "";
}
function updateCount() {
  $("count").innerHTML = '已扫 ' + scanned.size + ' <small>/ ' + whitelist.size + ' 单</small>';
  const u = $("unknown");
  u.textContent = '未知来源 ' + offlist.size;
  u.classList.toggle("hot", offlist.size > 0);
}
function pushRecent(text, bad) {
  const el = document.createElement("span");
  el.textContent = text; if (bad) el.className = "r-bad";
  const r = $("recent"); r.prepend(el);
  while (r.children.length > 6) r.removeChild(r.lastChild);
}

// —— 分批清点 —— 分段进度条：N 个格子，前 cpSince 个点亮（数亮格=当前 x/N）
function renderCpBar() {
  const bar = $("cpbar");
  if (!cpEnabled) { bar.hidden = true; return; }
  bar.hidden = false;
  while (bar.children.length > cpN) bar.removeChild(bar.lastChild);   // 增量增删（cpN 变了才动），不整段重建
  while (bar.children.length < cpN) { const s = document.createElement("span"); s.className = "seg"; bar.appendChild(s); }
  for (let i = 0; i < cpN; i++) bar.children[i].className = "seg" + (i < cpSince ? " on" : "");
}
// —— 分批清点 —— 顶栏「本批 x/N」+ 对不上累计 + 进度条；关闭时全隐藏
function updateCpProg() {
  const el = $("cpprog");
  if (!cpEnabled) { el.hidden = true; renderCpBar(); return; }
  el.hidden = false;
  const miss = cpLog.filter(c => c.result === "mismatch").length;
  el.textContent = "本批 " + cpSince + "/" + cpN + (miss ? "  对不上 " + miss : "");
  el.classList.toggle("hot", miss > 0);
  renderCpBar();
}
// 把配置状态同步到底栏控件（启动 + 恢复存档后调用）
function syncCpUI() {
  $("cpn").value = cpN;
  $("cptoggle").checked = cpEnabled;
  $("cpcfg").classList.toggle("off", !cpEnabled);
  updateCpProg();
}
// 弹出检查点浮层：size=本批应有件数；final=收尾批（不足 N）；onAck=点掉后要跑的回调
function showCheckpoint(size, final, onAck) {
  cpActive = true; cpCur = { size, final: !!final }; cpPending = onAck || null;
  $("cpbig").textContent = final ? "收尾清点" : "清点这一批";
  $("cpsub").innerHTML = "应为 <b>" + size + "</b> 件，数一下刚才这一" + (final ? "批" : "摞") + "，对上再继续";
  $("cp").hidden = false;
  beepCP();
}
// 点掉浮层：记录本检查点结果 → 归零本批计数 → 继续（或跑收尾回调）
function ackCheckpoint(result) {
  if (!cpActive || !cpCur) return;
  cpLog.push({ idx: cpLog.length + 1, at: new Date().toISOString(), size: cpCur.size, result, final: cpCur.final });
  cpSince = 0; cpActive = false; cpCur = null;
  $("cp").hidden = true; buf = "";          // 清掉浮层期间可能积累的杂散字符
  persist(); updateCpProg();
  const cb = cpPending; cpPending = null;
  if (cb) cb(result);
}
$("cpok").addEventListener("click",  () => ackCheckpoint("ok"));
$("cpbad").addEventListener("click", () => ackCheckpoint("mismatch"));
$("cpn").addEventListener("change", () => {
  const v = parseInt($("cpn").value, 10);
  cpN = (isFinite(v) && v >= 1) ? v : cpN;
  $("cpn").value = cpN; updateCpProg(); persist();
});
$("cptoggle").addEventListener("change", () => {
  cpEnabled = $("cptoggle").checked;
  $("cpcfg").classList.toggle("off", !cpEnabled);
  updateCpProg(); persist();
});

// —— 持久层：内存 Map 是数据源；localStorage 为主，写失败自动降级 IndexedDB，两者皆挂则仅内存 ——
// 降级不阻断扫码（能一直扫、导出读内存），只影响「刷新/崩溃兜底」的持久性 → 降级时红屏报警 + 顶栏常驻提示。
const KEEP_DAYS = 30;                                   // 旧存档保留天数；超期启动时自动清理
const SKEY = "youhuo_scan_";
const todayKey = () => SKEY + new Date().toISOString().slice(0,10);

let storageMode = "ls";        // "ls"=localStorage | "idb"=已降级 IndexedDB | "mem"=两者皆挂仅内存
let degradedOnce = false;

// -- IndexedDB 极简 KV（浏览器原生，零依赖；仅降级/读回时才真正建库）--
let _idb = null;
function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((res, rej) => {
    let req; try { req = indexedDB.open("youhuo_scan_db", 1); } catch(e) { return rej(e); }
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => { _idb = req.result; res(_idb); };
    req.onerror = () => rej(req.error);
  });
}
function idbPut(k, v) {
  return openIDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(k) {
  return openIDB().then(db => new Promise((res, rej) => {
    const r = db.transaction("kv", "readonly").objectStore("kv").get(k);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}

// -- 顶栏常驻存储状态：正常隐藏；降级黄；仅内存红 --
function updateStorg() {
  const el = $("storg");
  if (storageMode === "ls") { el.hidden = true; el.className = ""; return; }
  el.hidden = false;
  if (storageMode === "idb") { el.textContent = "⚠备用存储"; el.className = "warn"; }
  else { el.textContent = "⚠仅内存·勿刷新"; el.className = "bad"; }
}
function degrade(err) {                                 // localStorage 写失败 → 切 IDB，红屏报警一次（不阻断）
  storageMode = "idb"; updateStorg(); cleanupIDBOld();
  if (!degradedOnce) {
    degradedOnce = true;
    setState("bad", "存储降级", "", "本地存储写入失败（可能配额满/无痕模式），已切到<b>备用存储</b>继续记录。收工务必导出，并清理旧数据", String((err && err.name) || err));
    beepBad();
  }
}
function failMem(err) {                                 // 连 IDB 也失败：仅内存，红屏 + 顶栏常驻红
  storageMode = "mem"; updateStorg();
  setState("bad", "仅存内存！", "", "本地与备用存储都写入失败，记录<b>仅在内存</b>。<b>切勿刷新/关闭，尽快导出</b>", String((err && err.name) || err));
  beepBad();
}

function persist() {                                    // 每扫一单调用；内存已先写，这里做旁路持久化
  const payload = JSON.stringify({ whitelist: [...whitelist.values()], scanned: [...scanned.values()], offlist: [...offlist.values()],
    cp: { since: cpSince, log: cpLog, n: cpN, enabled: cpEnabled } });
  if (storageMode === "ls") {
    try { localStorage.setItem(todayKey(), payload); return; } catch(e) { degrade(e); }
  }
  if (storageMode === "idb") { idbPut(todayKey(), payload).catch(e => failMem(e)); return; }
  // mem：无处可写，红屏已挂，等导出
}

// -- 读回今日存档（并入内存 Map，按 track 去重）：localStorage 与 IDB 都并一遍，兼容降级过的场景 --
function mergePayload(raw) {
  let d; try { d = JSON.parse(raw); } catch(e) { return 0; }
  let n = 0;
  for (const it of (d.whitelist || [])) {               // 先重建白名单：已扫恢复按白名单过滤，白名单须先在位
    const k = norm(it.track);
    if (k && !whitelist.has(k)) whitelist.set(k, it);    // 只增不删（同日多份清单取并集，本工具白名单本就只增）
  }
  for (const it of (d.scanned || [])) {
    const k = norm(it.track);
    if (whitelist.has(k) && !scanned.has(k)) { scanned.set(k, it); n++; }
  }
  for (const it of (d.offlist || [])) {
    const k = norm(it.track);
    if (whitelist.has(k)) {                             // 之前名单外、现在其清单已载入 → 迁回有货集合
      if (!scanned.has(k)) {
        const w = whitelist.get(k);
        scanned.set(k, { ref: w.ref, seq: w.seq, track: w.track, store: w.store, at: it.at }); n++;
      }
    } else if (!offlist.has(k)) {
      offlist.set(k, it);
    }
  }
  if (d.cp) {                                            // 恢复分批清点位置：本批计数、检查点记录、配置
    if (typeof d.cp.since === "number") cpSince = d.cp.since;
    if (Array.isArray(d.cp.log)) cpLog = d.cp.log;
    if (typeof d.cp.n === "number" && d.cp.n >= 1) cpN = d.cp.n;
    if (typeof d.cp.enabled === "boolean") cpEnabled = d.cp.enabled;
  }
  return n;
}
async function restore() {
  let n = 0, lsRaw = null;
  try { lsRaw = localStorage.getItem(todayKey()); } catch(e) {}
  if (lsRaw) n += mergePayload(lsRaw);
  try { const v = await idbGet(todayKey()); if (v) n += mergePayload(v); } catch(e) {}  // 曾降级则数据在此
  return n;
}

// -- 启动自动清理 N 天前旧存档（只删本工具 youhuo_scan_ 前缀的 key）--
function _tooOld(key) {
  const d = new Date(key.slice(SKEY.length));
  return !isNaN(d) && d.getTime() < Date.now() - KEEP_DAYS * 864e5;
}
function cleanupLSOld() {
  try { for (const k of Object.keys(localStorage)) if (k.startsWith(SKEY) && _tooOld(k)) localStorage.removeItem(k); } catch(e) {}
}
function cleanupIDBOld() {
  openIDB().then(db => {
    const store = db.transaction("kv", "readwrite").objectStore("kv");
    const req = store.getAllKeys();
    req.onsuccess = () => req.result.forEach(k => { if (typeof k === "string" && k.startsWith(SKEY) && _tooOld(k)) store.delete(k); });
  }).catch(() => {});
}
cleanupLSOld();
syncCpUI();                            // 启动即把分批清点默认态（开启·N=10）呈现到界面

// —— 启动自动恢复：读回今日存档（含白名单），刷新/崩溃后原样回来，无需重载清单 ——
// 白名单现随存档持久化，故 restore() 能重建白名单→再并已扫，恢复不再依赖「手动重载 CSV」。
(async function startupRestore() {
  let restored = 0;
  try { restored = await restore(); } catch(e) {}
  if (!whitelist.size) return;                       // 今日无存档（新的一天/新机器）→ 保持初始「载入清单」态
  $("export").disabled = false; $("reset").disabled = false;
  updateCount(); syncCpUI();                         // 恢复的已扫计数、分批清点进度/配置同步到界面
  const dist = new Map();
  for (const w of whitelist.values()) { const s = w.store || ""; if (s) dist.set(s, (dist.get(s) || 0) + 1); }
  let storeTxt = "";
  if (dist.size === 1) storeTxt = `（店：${[...dist.keys()][0]}）`;
  else if (dist.size > 1) storeTxt = `（${[...dist].map(([s, n]) => `${s} ${n} 单`).join(" + ")}）`;
  setState("idle", "已恢复今日", "",
    `刷新前的记录已找回：白名单 <b>${whitelist.size}</b> 单${storeTxt}，已扫 <b>${scanned.size}</b> 单` +
    (offlist.size ? `，未知来源 ${offlist.size}` : ""),
    "接着扫即可。若要追加另一店清单，仍可再「载入扫码清单」");
  pushRecent("已恢复 " + scanned.size + " 单", false);
})();

// —— 载入白名单（多选/多次追加，各店合并；不清空已扫）——
function readText(f) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result); fr.onerror = rej;
    fr.readAsText(f, "utf-8");
  });
}
$("file").addEventListener("change", async e => {
  unlockAudio();
  const files = [...e.target.files]; e.target.value = "";   // 允许重载同名/再次追加
  if (!files.length) return;
  const bad = []; let anyOk = false;
  for (const f of files) {
    let text; try { text = await readText(f); } catch(_) { bad.push(f.name); continue; }
    const { rows, header } = parseCSV(text);
    const cTrack = colOf(header, ["VO Tracking No", "Tracking", "运单号", "运单"]);
    const cRef   = colOf(header, ["Order Reference", "订单号"]);
    const cSeq   = colOf(header, ["序号"]);
    const cStore = colOf(header, ["店", "channel", "渠道"]);
    if (!cTrack || !cRef) { bad.push(f.name + "(缺列)"); continue; }
    for (const r of rows) {
      const k = norm(r[cTrack]);
      if (!k) continue;
      const st = cStore ? (r[cStore] || "") : "";
      whitelist.set(k, { ref: r[cRef], seq: cSeq ? r[cSeq] : "", track: r[cTrack], store: st });
      anyOk = true;
    }
  }
  const restored = await restore();
  persist();                          // 保存 restore 可能触发的「名单外→有货」迁移
  updateCount(); syncCpUI();          // 恢复的分批清点配置/进度同步到界面
  if (!anyOk && !whitelist.size) {
    setState("bad", "清单格式错", "", "所选文件都缺 <b>VO Tracking No</b> 或 <b>Order Reference</b> 列，检查是否选错文件", "");
    beepBad(); return;
  }
  $("export").disabled = false; $("reset").disabled = false;
  const dist = new Map();                       // 从累计白名单算每店单数（不只本批），避免「总数是两份之和、店却只显示本批」的歧义
  for (const w of whitelist.values()) { const s = w.store || ""; if (s) dist.set(s, (dist.get(s) || 0) + 1); }
  let storeTxt = "";
  if (dist.size === 1) storeTxt = `（店：${[...dist.keys()][0]}）`;                                  // 单店：照旧
  else if (dist.size > 1) storeTxt = `（${[...dist].map(([s, n]) => `${s} ${n} 单`).join(" + ")}）`;  // 多店：摊开每店各几单
  const noteRestore = restored ? `，已恢复今日已扫 ${restored} 单` : "";
  const badTxt     = bad.length ? `；⚠跳过 ${bad.length} 个文件：${bad.join("、")}` : "";
  setState(bad.length ? "bad" : "idle", "就绪", "",
    `白名单共 <b>${whitelist.size}</b> 单已载入${storeTxt}${noteRestore}${badTxt}`,
    "开始扫码。绿=清单内已记录，黄=未知来源已记录，红=拒绝");
  if (bad.length) beepBad();
  pushRecent("载入 " + whitelist.size + " 单", false);
  $("note").textContent = files.map(f => f.name).join(", ");
});

// —— 扫码处理 ——
function handleScan(raw) {
  if (cpActive) return;                        // 检查点浮层期间暂停扫码，专心清点
  const code = norm(raw);
  if (!code) return;
  unlockAudio();
  if (whitelist.size === 0) {
    setState("bad", "未载入清单", "", "请先「载入扫码清单」再扫码", "");
    beepBad(); return;
  }
  const hit = whitelist.get(code);
  if (hit) {
    if (scanned.has(code)) {                    // 清单内 + 重复
      const s = scanned.get(code);
      setState("bad", "重复", "序号 " + (s.seq||"?"), "该单已扫过，勿重复装箱", s.ref + "  " + s.track);
      beepBad(); pushRecent("重复 " + (s.seq||"?"), true);
    } else {                                     // 清单内 + 首次 → 记录
      const rec = { ref: hit.ref, seq: hit.seq, track: hit.track, store: hit.store, at: new Date().toISOString() };
      scanned.set(code, rec); persist(); updateCount();
      setState("ok", "OK", "序号 " + (hit.seq||"?"), hit.ref, hit.track);
      beepOK(); pushRecent("✓ " + (hit.seq||"?"), false);
      if (cpEnabled) {                           // 分批清点：只对成功记入有货的绿色扫描计数
        cpSince++; updateCpProg();
        if (cpSince >= cpN) showCheckpoint(cpN, false, null);
      }
    }
  } else if (isLP(code)) {                        // LP 结构但不在任何已载入清单
    if (offlist.has(code)) {                      // 名单外 + 重复
      setState("bad", "重复(未知来源)", "", "该未知来源运单已扫过，勿重复装箱", code);
      beepBad(); pushRecent("重复", true);
    } else {                                      // 名单外 + 首次 → 黄屏记录（不拒绝）
      offlist.set(code, { track: code, at: new Date().toISOString() });
      persist(); updateCount();
      setState("warn", "未知来源", "已记录", "不在今日任何清单（可能昨日残留/串批）。<b>已记录</b>，收工核对", code);
      beepWarn(); pushRecent("未知 " + offlist.size, false);
    }
  } else {                                        // 非 LP 结构（SF 号 / 订单号 / 二维码等）
    setState("bad", "不是 LP 单号", "", "扫到了非 LP 条码（可能是 SF 号 / 订单号 / 二维码）。<b>请扫面单顶部 LP 一维码</b>", code);
    beepBad(); pushRecent("非LP", true);
  }
}

// —— 键盘楔入采集（扫码枪当键盘打字，末尾回车触发）——
document.addEventListener("keydown", e => {
  if (cpActive) return;                  // 检查点浮层期间不采集扫码，避免把杂散字符攒进下一批
  const now = Date.now();
  if (now - lastKeyTs > 500) buf = "";   // 间隔过久视为新一次扫描，清缓冲
  lastKeyTs = now;
  if (e.key === "Enter") {
    const v = buf; buf = "";
    if (v) handleScan(v);
    e.preventDefault();
  } else if (e.key.length === 1) {
    buf += e.key;
  }
});

// —— 导出：n+1 份 CSV 打进一个 store-only zip 一次下载，规避 Chrome「下载多个文件」拦截（曾静默丢掉整店清单）——
// n 份按店「有货清单{店}{n}单.csv」→ stage2 入口；+1 份「未知来源运单」供人工核对。内层 CSV 名/格式不变，操作员解压后投递。
function downloadBlob(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click(); URL.revokeObjectURL(a.href);
}
// -- 手写零依赖 store-only ZIP（不压缩）：本地头30B + 中央目录46B + EOCD22B，通用位标记 bit11=UTF-8 文件名（中文不乱码）--
const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = _crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {                                // files: [{ name, bytes:Uint8Array }]
  const enc = new TextEncoder();
  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  const parts = [], central = []; let offset = 0;
  for (const f of files) {
    const nb = enc.encode(f.name), crc = crc32(f.bytes), sz = f.bytes.length;
    const local = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(crc), u32(sz), u32(sz), u16(nb.length), u16(0));
    parts.push(new Uint8Array(local), nb, f.bytes);
    central.push({ nb, crc, sz, offset });
    offset += local.length + nb.length + sz;
  }
  const cdStart = offset; let cdLen = 0; const cd = [];
  for (const c of central) {
    const rec = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(c.crc), u32(c.sz), u32(c.sz),
      u16(c.nb.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset));
    cd.push(new Uint8Array(rec), c.nb); cdLen += rec.length + c.nb.length;
  }
  const eocd = [].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(cdLen), u32(cdStart), u16(0));
  return new Blob([...parts, ...cd, new Uint8Array(eocd)], { type: "application/zip" });
}
$("export").addEventListener("click", () => {
  // 收工=最后一次清点：若本批还有没核对的余数，先弹收尾检查点，点掉再真正导出
  if (cpEnabled && cpSince > 0) { showCheckpoint(cpSince, true, doExport); return; }
  doExport();
});
function doExport() {
  const byStore = new Map();                       // 店 -> 记录数组
  for (const r of scanned.values()) {
    const s = r.store || "";
    if (!byStore.has(s)) byStore.set(s, []);
    byStore.get(s).push(r);
  }
  const jobs = [];                                 // [文件名, csv]
  for (const [s, recs] of byStore) {
    recs.sort((a,b) => (parseInt(a.seq)||0) - (parseInt(b.seq)||0));
    let csv = "序号,Order Reference,VO Tracking No,店\n";
    for (const r of recs) csv += [r.seq, r.ref, r.track, s].join(",") + "\n";
    jobs.push(["有货清单" + (s || "") + recs.length + "单.csv", csv]);
  }
  if (offlist.size) {                              // 名单外单独成文件，仅一列
    let csv = "未知来源运单\n";
    for (const r of offlist.values()) csv += r.track + "\n";
    jobs.push(["未知来源运单" + offlist.size + "单.csv", csv]);
  }
  if (!jobs.length) {
    setState("bad", "无可导出", "", "还没扫到任何单", "");
    beepBad(); return;
  }
  const enc = new TextEncoder();
  const zipFiles = jobs.map(([name, csv]) => ({ name, bytes: enc.encode("﻿" + csv) }));  // 内层 CSV 保留 utf-8-sig BOM
  const zipName = "有货清单打包_" + new Date().toISOString().slice(0,10) + ".zip";
  downloadBlob(zipName, makeZip(zipFiles));            // 单次下载，不触发多文件拦截
  const miss = cpLog.filter(c => c.result === "mismatch").length;
  const cpTxt = cpLog.length
    ? `；分批清点 ${cpLog.length} 批` + (miss ? `，其中 ${miss} 批当场对不上，收工请复核` : `，全部对上`)
    : "";
  setState(miss ? "warn" : "idle", "已导出", "",
    `已打包 <b>${jobs.length}</b> 份为 <b>${zipName}</b>：${jobs.map(j => j[0]).join("、")}${cpTxt}`,
    "下载后解压，把每份有货清单 CSV 投阶段二；未知来源那份交人工核对");
}

// —— 清空今日（收工重来 / 换批）——
$("reset").addEventListener("click", () => {
  if (!confirm("清空今日已扫的 " + scanned.size + " 单 + 未知来源 " + offlist.size + " 单记录？（不影响白名单）")) return;
  scanned = new Map(); offlist = new Map();
  cpSince = 0; cpLog = [];                          // 分批清点计数与检查点记录一并清零（配置保留）
  persist(); updateCount(); updateCpProg();
  setState("idle", "已清空", "", "已扫记录清零，白名单保留。可重新开扫", "");
});
</script>
</body>
</html>
