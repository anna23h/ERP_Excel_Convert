<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --ground:#EFF3F2; --surface:#FFFFFF; --surface-2:#F6F9F8; --surface-3:#E8EEEC;
  --ink:#131A19; --muted:#576663; --faint:#87938F;
  --line:#DAE2E0; --line-strong:#BFCBC8;
  --accent:#0C5A61; --accent-soft:#D8EAEA; --accent-line:#8FC0C2;
  --warn:#8A5100; --warn-soft:#F8E7C9; --warn-line:#DCB878;
  --danger:#9B2A20; --danger-soft:#F7DCD8; --danger-line:#DFA49C;
  --ok:#28633D; --ok-soft:#D7E9DD; --ok-line:#8FBDA1;
  --shadow-1:0 1px 2px rgba(19,26,25,.07);
  --shadow-2:0 2px 4px rgba(19,26,25,.06),0 12px 28px rgba(19,26,25,.10);
  --r:10px;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --disp:"Archivo","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1312; --surface:#151D1C; --surface-2:#1B2423; --surface-3:#222D2B;
    --ink:#E5ECEA; --muted:#94A29E; --faint:#71807C;
    --line:#26312F; --line-strong:#35423F;
    --accent:#54BFC0; --accent-soft:#123234; --accent-line:#2A5F62;
    --warn:#DFA55C; --warn-soft:#2E2415; --warn-line:#5C4726;
    --danger:#E08276; --danger-soft:#301A17; --danger-line:#5E3129;
    --ok:#74C08A; --ok-soft:#152A1D; --ok-line:#2C5138;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1312; --surface:#151D1C; --surface-2:#1B2423; --surface-3:#222D2B;
  --ink:#E5ECEA; --muted:#94A29E; --faint:#71807C;
  --line:#26312F; --line-strong:#35423F;
  --accent:#54BFC0; --accent-soft:#123234; --accent-line:#2A5F62;
  --warn:#DFA55C; --warn-soft:#2E2415; --warn-line:#5C4726;
  --danger:#E08276; --danger-soft:#301A17; --danger-line:#5E3129;
  --ok:#74C08A; --ok-soft:#152A1D; --ok-line:#2C5138;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.45);
}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

/* ---------- shell ---------- */
#root{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px 10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand .sub{font-size:12px;color:var(--faint)}
.who{display:flex;align-items:center;gap:6px}
.who input{width:104px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px}
.langs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px}
.langs button{border:0;background:transparent;border-radius:5px;padding:3px 9px;font-size:11.5px;font-family:var(--disp);font-weight:600;letter-spacing:.04em;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

.stats{display:flex;gap:0;flex-wrap:wrap;padding:0 20px 12px}
.stat{display:flex;flex-direction:column;gap:1px;padding:6px 20px 6px 0;margin-right:20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat.warn .v{color:var(--warn)} .stat.danger .v{color:var(--danger)} .stat.ok .v{color:var(--ok)}

.tabs{display:flex;gap:2px;padding:0 20px}
.tab{border:0;background:transparent;padding:7px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
main{flex:1;min-height:0;display:flex;flex-direction:column}
::placeholder{color:var(--faint);opacity:1}
.notice{margin:0 20px 10px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);border-radius:8px;padding:7px 12px;font-size:12.5px}

/* ---------- board ---------- */
.lanes{display:flex;gap:12px;padding:14px 20px 28px;overflow-x:auto;align-items:flex-start;flex:1}
.lane{flex:1 1 262px;min-width:250px;max-width:440px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.lane-head{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.lane-head .t{display:flex;align-items:center;gap:7px}
.lane-head h2{font-size:13px;font-weight:600;margin:0}
.lane-head .c{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-3);border-radius:9px;padding:0 6px}
.lane-head .h{font-size:11px;color:var(--faint);margin-top:2px;line-height:1.4}
.lane-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.lane-empty{font-size:12px;color:var(--faint);text-align:center;padding:18px 8px;border:1px dashed var(--line-strong);border-radius:8px}

.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:9px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-1);transition:box-shadow .12s,transform .12s}
.card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.card.sev-warn{border-left-color:var(--warn-line)}
.card.sev-danger{border-left-color:var(--danger-line)}
.card.sev-ok{border-left-color:var(--ok-line)}
.card-top{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card-name{font-size:13.5px;font-weight:600;line-height:1.35;flex:1 1 100%}
.card-alt{font-size:11px;color:var(--faint);line-height:1.35;flex:1 1 100%;word-break:break-word}
.card-pzn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag{font-size:10px;border-radius:4px;padding:0 5px;border:1px solid}
.tag.demo{color:var(--faint);border-color:var(--line-strong)}
.tag.pref{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.prog{display:flex;flex-direction:column;gap:3px}
.prog-row{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--muted)}
.prog-row .big{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.prog-row .gap{color:var(--warn);font-weight:500;margin-left:auto}
.prog-row .done{color:var(--ok);font-weight:500;margin-left:auto}
.bar{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar i.alloc{background:var(--accent-line)}
.bar i.recv{background:var(--accent)}

.card-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.card-foot{border-top:1px dashed var(--line);padding-top:6px;font-size:11px;color:var(--muted)}
.aging.hot{color:var(--danger);font-weight:500}
.aging.warm{color:var(--warn)}

/* ---------- table ---------- */
.tablewrap{padding:14px 20px 28px;flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:940px}
th{position:sticky;top:0;text-align:left;font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr.hot td{background:var(--danger-soft)}
tbody tr.hot:hover td{filter:brightness(.98)}
td .p1{font-weight:500}
td .p2{font-size:11px;color:var(--faint);margin-top:1px}
.empty{padding:26px;text-align:center;color:var(--faint);font-size:13px}

.chip{display:inline-block;font-size:11px;border-radius:5px;padding:1px 7px;border:1px solid;white-space:nowrap}
.chip.todo{color:var(--muted);border-color:var(--line-strong);background:var(--surface-2)}
.chip.sourcing{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.chip.quoted{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.ordered{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.chip.closed{color:var(--faint);border-color:var(--line);background:var(--surface-2)}
.chip.asked{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.chip.chosen{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.received{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.chip.declined,.chip.oos{color:var(--faint);border-color:var(--line);background:var(--surface-2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,15,.42);z-index:40;backdrop-filter:blur(1.5px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow-2)}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.drawer-head .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.drawer-head .x{margin-left:auto}
.drawer-body{padding:14px 16px 30px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12.5px}
.kv dt{color:var(--faint)}
.kv dd{margin:0}
.section-lbl{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}

.supchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sup{border:1px dashed var(--line-strong);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
.sup:hover{border-style:solid;background:var(--surface-2)}
.sup.on{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.supform{display:flex;gap:5px}
.supform input{width:130px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}

.alloc{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.alloc.hot{border-color:var(--danger-line);background:var(--danger-soft)}
.alloc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.alloc-head .sup-name{font-weight:600;font-size:13px}
.alloc-head .when{font-size:11px;color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:7px}
.field{display:flex;flex-direction:column;gap:2px}
.field.full{grid-column:1/-1}
.field label{font-size:10.5px;color:var(--faint)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;width:100%}
.field textarea{min-height:52px;resize:vertical}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.hint{font-size:11px;color:var(--faint);line-height:1.45}
.err{font-size:11.5px;color:var(--danger)}
details.adv summary{font-size:12px;color:var(--muted);cursor:pointer;padding:2px 0}
.danger-text{color:var(--danger)}

.saving{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ground);font-size:12.5px;padding:6px 14px;border-radius:20px;box-shadow:var(--shadow-2)}
.saving.err{background:var(--danger);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  .topbar-row{padding:10px 14px 8px} .stats{padding:0 14px 10px} .tabs{padding:0 14px}
  .lanes{padding:12px 14px 24px} .lane{flex-basis:88vw;max-height:none}
  .tablewrap{padding:12px 14px 24px}
}
</style>

/* ---------- 参考字典（ISSUES C-1）------------------------------------------
   体积大、人人相同、且不需要通过看板共享 → 存浏览器本地，**不进发布文档**。
   查名顺序：看板 products（权威、共享） → 这份参考字典（只读、补白）。
   取不到一律当「没载入」，绝不因此挡住任何流程。 */
var DICT_KEY = "sb-dict";
var refDict = null;          // {v, at, d:{PZN:[德语名, 中文名]}}
try{
  var rawDict = localStorage.getItem(DICT_KEY);
  if(rawDict){
    var parsed = JSON.parse(rawDict);
    if(parsed && parsed.d) refDict = parsed;
  }
}catch(e){ refDict = null; }

function refCount(){ try{ return refDict ? Object.keys(refDict.d).length : 0; }catch(e){ return 0; } }
/** → {nameDe, nameZh} 或 null。只读，不写回。 */
function lookupRef(pzn){
  if(!refDict || !pzn) return null;
  var hit = refDict.d[pzn];
  if(!hit) return null;
  return {nameDe: hit[0] || "", nameZh: hit[1] || ""};
}
/** 看板字典 → 参考字典。两处都没有才返回 null。 */
function knownProduct(pzn){
  if(!pzn) return null;
  return state.products[pzn] || lookupRef(pzn);
}

function t(key){
  var row = T[key];
  if(!row) return key;
  var s = row[lang] || row.zh;
  for(var i = 1; i < arguments.length; i++) s = s.replace("%s", arguments[i]);
  return s;
}

/* =======================================================================
   ② 纯计算：派生量与阶段推导。不碰 DOM，不改 state。
   ======================================================================= */
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function now(){ return new Date().toISOString(); }
function hoursSince(iso){ return iso ? (Date.now() - new Date(iso).getTime()) / 36e5 : 0; }
function ago(iso){
  if(!iso) return t("none");
  var h = hoursSince(iso);
  if(h < 0.017) return t("justNow");
  if(h < 1) return t("minutes", Math.round(h * 60));
  if(h < 48) return t("hours", h < 10 ? h.toFixed(1) : Math.round(h));
  return t("days", Math.round(h / 24));
}
function dayLabel(d){
  if(!d) return t("none");
  var dt = new Date(d + "T00:00:00");
  if(isNaN(dt)) return d;
  var diff = Math.round((dt - new Date(new Date().toDateString())) / 864e5);
  if(diff === 0) return d + t("today");
  return d + (diff > 0 ? t("inDays", diff) : t("agoDays", -diff));
}
/** PZN 归一：7~8 位数字 → 补零 8 位。其它一律 null（强校验，不静默接受脏值）。 */
function normPzn(v){
  var s = String(v == null ? "" : v).replace(/[^\d]/g, "");
  return /^\d{7,8}$/.test(s) ? s.padStart(8, "0") : null;
}
function product(pzn){
  return state.products[pzn] || {pzn:pzn, nameDe:"", nameZh:"", aliases:[]};
}
/** 产品名按语言主副换位；PZN 两端都常驻，它是唯一无歧义的锚。 */
function nameMain(p){
  if(lang === "zh") return p.nameZh || p.nameDe || p.pzn;
  return p.nameDe || p.nameZh || p.pzn;
}
function nameAlt(p){
  if(lang === "zh") return p.nameZh ? p.nameDe : "";
  return p.nameDe ? p.nameZh : "";
}

function sumQty(t_, states){
  var n = 0;
  (t_.allocs || []).forEach(function(a){ if(states[a.state]) n += Number(a.qty) || 0; });
  return n;
}
function allocated(t_){ return sumQty(t_, COUNTED); }
function receivedQty(t_){
  var n = 0;
  (t_.allocs || []).forEach(function(a){ n += Number(a.receivedQty) || 0; });
  return n;
}
function gapOf(t_){ return Math.max(0, (Number(t_.qty) || 0) - allocated(t_)); }
function pendingAsks(t_){ return (t_.allocs || []).filter(function(a){ return a.state === "asked"; }); }
function oldestPendingH(t_){
  var p = pendingAsks(t_);
  return p.length ? Math.max.apply(null, p.map(function(a){ return hoursSince(a.askedAt); })) : 0;
}
function allocIsHot(a){ return a.state === "asked" && hoursSince(a.askedAt) >= STALE_ASK_H; }
function taskIsHot(t_){ return (t_.allocs || []).some(allocIsHot); }

/** 阶段推导：跨分配条目聚合。手动推进（ordered/closed）优先。 */
function deriveStage(t_){
  if(t_.stageManual) return t_.stageManual;
  var live = (t_.allocs || []).filter(function(a){ return LIVE[a.state]; });
  if(!live.length) return "todo";
  if(live.some(function(a){ return a.state === "ordered" || a.state === "received"; })) return "ordered";
  if(live.some(function(a){ return a.state === "chosen" || a.state === "quoted"; })) return "quoted";
  return "sourcing";
}
function lastTouch(t_){
  var x = t_.createdAt;
  (t_.allocs || []).forEach(function(a){ if(a.updatedAt && a.updatedAt > x) x = a.updatedAt; });
  return x;
}
function severity(t_){
  var st = deriveStage(t_);
  if(st === "closed") return "";
  if(taskIsHot(t_)) return "danger";
  if(st === "todo" && hoursSince(t_.createdAt) >= STALE_NEW_H) return "warn";
  if(st === "ordered") return "ok";
  if(st === "quoted") return "ok";
  if(pendingAsks(t_).length) return "warn";
  return "";
}
function findTask(id){
  for(var i = 0; i < state.tasks.length; i++) if(state.tasks[i].id === id) return state.tasks[i];
  return null;
}
function findAlloc(tid, aid){
  var t_ = findTask(tid); if(!t_) return null;
  for(var i = 0; i < (t_.allocs || []).length; i++) if(t_.allocs[i].id === aid) return t_.allocs[i];
  return null;
}
function nextId(prefix){ state.seq = (state.seq || 0) + 1; return prefix + state.seq; }
function newTaskId(){
  var d = new Date();
  var base = "T-" + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-";
  var n = 1;
  while(state.tasks.some(function(x){ return x.id === base + String(n).padStart(2, "0"); })) n++;
  return base + String(n).padStart(2, "0");
}
/** 同一 PZN 是否已有进行中的一轮（未关闭）。用于「并入还是另起一轮」的提示。 */
function openRoundFor(pzn){
  for(var i = 0; i < state.tasks.length; i++){
    var x = state.tasks[i];
    if(x.pzn === pzn && deriveStage(x) !== "closed") return x;
  }
  return null;
}
function matchesQuery(t_, q){
  if(!q) return true;
  q = q.toLowerCase();
  var p = product(t_.pzn);
  var hay = [p.pzn, p.nameDe, p.nameZh].concat(p.aliases || []).concat(t_.requesters || []);
  return hay.some(function(v){ return String(v || "").toLowerCase().indexOf(q) >= 0; });
}

/* ---------- 导入解析：先试 JSON，再试带表头的表格。认不出就报错，不猜。 ---------- */
//  列名别名。销售的表可能是中文、德文或英文表头，全都往同一组字段上落。
var COLS = {
  pzn:               ["pzn", "编码", "药品编码", "code", "artikelnummer"],
  qty:               ["qty", "quantity", "数量", "订货量", "menge", "order quantity", "anzahl"],
  unit:              ["unit", "单位", "einheit"],
  needBy:            ["needby", "need by", "要货日", "交期", "bedarfstermin", "termin"],
  mhdMin:            ["mhd", "mhdmin", "效期", "期望效期", "最低效期", "mindest-mhd", "expiry"],
  preferredSupplier: ["supplier", "供应商", "指定采购方", "指定供应商", "lieferant", "wunschlieferant"],
  nameDe:            ["namede", "name", "德语名", "德文名", "品名", "bezeichnung"],
  nameZh:            ["namezh", "中文名", "中文品名", "chinese name"],
  aliases:           ["aliases", "简称", "别名", "kurzname"],
  requesters:        ["requester", "requesters", "提出人", "谁要的", "angefordert von"],
  refPrice:          ["refprice", "参考价", "aep", "hap", "aep/hap", "referenzpreis"],
  note:              ["note", "备注", "notiz", "bemerkung"]
};
function colKey(header){
  var h = String(header || "").replace(/[​‌‍﻿]/g, "").trim().toLowerCase().replace(/[\s_-]+/g, "");
  for(var k in COLS){
    for(var i = 0; i < COLS[k].length; i++){
      if(COLS[k][i].replace(/[\s_-]+/g, "") === h) return k;
    }
  }
  return null;
}
function toList(v){
  if(Array.isArray(v)) return v.map(function(x){ return String(x).trim(); }).filter(Boolean);
  return String(v == null ? "" : v).split(/[,，;；]/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function normRow(o){
  return {
    pzn:               String(o.pzn == null ? "" : o.pzn).trim(),
    qty:               o.qty == null || o.qty === "" ? "" : String(o.qty).replace(/[^\d.]/g, ""),
    unit:              String(o.unit || "").trim(),
    needBy:            String(o.needBy || "").trim(),
    mhdMin:            String(o.mhdMin || "").trim(),
    preferredSupplier: normSupplier(o.preferredSupplier || ""),
    nameDe:            String(o.nameDe || "").trim(),
    nameZh:            String(o.nameZh || "").trim(),
    aliases:           toList(o.aliases),
    requesters:        toList(o.requesters),
    refPrice:          String(o.refPrice || "").trim(),
    note:              String(o.note || "").trim(),
    choice:            null      // 命中进行中的一轮时，人选 merge / new
  };
}
/** → {rows:[...]} 或 {error:"..."}。绝不在认不出格式时猜。 */
function parseImport(text){
  var raw = String(text || "").trim();
  if(!raw) return {error: t("errEmpty")};

  // ① JSON：数组、单个对象、或 {items:[...]}
  if(/^[\[{]/.test(raw)){
    var data;
    try{ data = JSON.parse(raw); }catch(e){ data = null; }
    if(data){
      var list = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : [data]);
      var rows = list.filter(function(x){ return x && typeof x === "object"; }).map(normRow);
      return rows.length ? {rows: rows} : {error: t("errEmpty")};
    }
  }

  // ② 带表头的表格：优先 tab（Excel 复制出来就是 tab），否则逗号/分号
  var lines = raw.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(lines.length < 2) return {error: t("errNotJson")};
  var sep = lines[0].indexOf("\t") >= 0 ? "\t" : (lines[0].indexOf(";") >= 0 ? ";" : ",");
  var head = lines[0].split(sep).map(colKey);
  if(head.indexOf("pzn") < 0) return {error: t("errNotJson")};
  var out = [];
  for(var i = 1; i < lines.length; i++){
    var cells = lines[i].split(sep), o = {};
    head.forEach(function(k, j){ if(k) o[k] = cells[j]; });
    if(String(o.pzn || "").trim()) out.push(normRow(o));
  }
  return out.length ? {rows: out} : {error: t("errEmpty")};
}
/** 行状态：ok / needName / dupRound / bad。实时算，不存——改一个字段就立刻重判。 */
function rowStatus(r){
  var pzn = normPzn(r.pzn);
  if(!pzn || !(Number(r.qty) > 0)) return "bad";
  if(!knownProduct(pzn) && !r.nameDe && !r.nameZh) return "needName";
  if(openRoundFor(pzn) && !r.choice) return "dupRound";
  return "ok";
}

function statsHTML(){
  var noAsk = 0, pend = 0, hot = 0, gap = 0;
  state.tasks.forEach(function(x){
    var st = deriveStage(x);
    if(st === "closed") return;
    if(st === "todo") noAsk++;
    pend += pendingAsks(x).length;
    (x.allocs || []).forEach(function(a){ if(allocIsHot(a)) hot++; });
    if(st !== "todo" && gapOf(x) > 0) gap++;
  });
  function cell(v, k, cls){
    return '<div class="stat' + (v && cls ? " " + cls : "") + '"><span class="v num">' + v + '</span><span class="k">' + t(k) + '</span></div>';
  }
  return '<div class="stats">' + cell(noAsk, "statTodo", "warn") + cell(pend, "statPending", "")
       + cell(hot, "statHot", "danger") + cell(gap, "statGap", "warn") + '</div>';
}

function progressHTML(t_){
  var need = Number(t_.qty) || 0, alloc = allocated(t_), recv = receivedQty(t_), gap = gapOf(t_);
  var pa = need ? Math.min(100, alloc / need * 100) : 0;
  var pr = need ? Math.min(100, recv / need * 100) : 0;
  var right = gap > 0
    ? '<span class="gap">' + esc(t("gap")) + ' <span class="num">' + gap + '</span></span>'
    : '<span class="done">' + esc(t("full")) + '</span>';
  return '<div class="prog">' +

function agingHTML(t_){
  var st = deriveStage(t_), txt = "", cls = "";
  if(st === "todo"){
    var h = hoursSince(t_.createdAt);
    txt = t("agingNoAsk", ago(t_.createdAt)); cls = h >= STALE_NEW_H ? "hot" : "";
  }else if(st === "sourcing"){
    var hs = oldestPendingH(t_);
    if(hs > 0){
      var oldest = pendingAsks(t_).map(function(a){ return a.askedAt; }).sort()[0];
      txt = t("agingOldest", ago(oldest)); cls = hs >= STALE_ASK_H ? "hot" : "warm";
    }
  }else if(st === "quoted"){
    txt = t("agingWait", ago(lastTouch(t_)));
  }
  return txt ? '<div class="card-foot"><span class="aging ' + cls + '">' + esc(txt) + '</span></div>' : "";
}

function passFilter(t_){
  var st = deriveStage(t_);
  switch(ui.filter){
    case "all":     return st !== "closed";
    case "todo":    return st === "todo";
    case "asking":  return pendingAsks(t_).length > 0;
    case "hot":     return taskIsHot(t_);
    case "gap":     return st !== "closed" && st !== "todo" && gapOf(t_) > 0;
    case "ordered": return st === "ordered";
    default:        return true;
  }
}

    return '<div>' + esc(a.supplier) + ' · <span style="color:' + col + '">' + esc(allocLabel(a.state)) + esc(tail) + '</span></div>';

var api = null, apiTried = false;
function getApi(){
  if(apiTried) return Promise.resolve(api);
  apiTried = true;
  if(!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  return window.claude.use("artifact").then(function(a){ api = a; return a; }).catch(function(){ return null; });
}
function toast(text, isErr){
  var el = document.getElementById("saving-toast");
  if(!el){ el = document.createElement("div"); el.id = "saving-toast"; document.body.appendChild(el); }
  el.className = "saving" + (isErr ? " err" : "");
  el.textContent = text;
  if(isErr) setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 6000);
}
function clearToast(){
  var el = document.getElementById("saving-toast");
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
function saveUI(){
  try{ sessionStorage.setItem("sb-ui", JSON.stringify({view:ui.view, filter:ui.filter, openId:ui.openId, q:ui.q})); }catch(e){}
}
function commit(){
  render(); saveUI();
  if(readOnly) return;
  toast(t("saving"));
  getApi().then(function(a){
    if(!a){ toast(t("savedLocal"), true); return; }
    return a.publish(buildDoc(state)).catch(function(err){
      var code = err && err.code;
      if(code === "conflict"){ toast(t("savedConflict")); return; }
      if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared"){
        readOnly = true; clearToast(); render(); return;
      }
      if(code === "rate_limited"){ toast(t("savedBusy"), true); return; }
      toast(t("savedFail", code || "?"), true);
    });
  });
}
function touch(a){ a.updatedAt = now(); a.by = me || a.by || ""; }

/** 只导 ok 的行；needName / dupRound / bad 一律留在暂存区等人处理，不静默放过。 */
function doImport(){
  if(readOnly) return;
  var today = new Date().toISOString().slice(0, 10);
  var kept = [];
  ui.staged.forEach(function(r){
    if(rowStatus(r) !== "ok"){ kept.push(r); return; }
    var pzn = normPzn(r.pzn), qty = Number(r.qty);

    // 字典随用随建：认过一次，以后同一产品只需 PZN
    var prod = state.products[pzn];
    if(!prod){
      var ref = lookupRef(pzn) || {nameDe:"", nameZh:""};
      prod = state.products[pzn] = {pzn:pzn,
        nameDe: r.nameDe || ref.nameDe, nameZh: r.nameZh || ref.nameZh, aliases:[]};
    }else{
      if(r.nameDe) prod.nameDe = r.nameDe;
      if(r.nameZh) prod.nameZh = r.nameZh;
    }
    r.aliases.forEach(function(x){ if(prod.aliases.indexOf(x) < 0) prod.aliases.push(x); });
    if(r.preferredSupplier && state.suppliers.indexOf(r.preferredSupplier) < 0){
      state.suppliers.push(r.preferredSupplier); state.suppliers.sort();
    }

    var open = openRoundFor(pzn);
    if(r.choice === "merge" && open){
      // 并入：量加上去，提出人并集，备注追加——不覆盖已有的任何东西
      open.qty = (Number(open.qty) || 0) + qty;
      r.requesters.forEach(function(x){
        open.requesters = open.requesters || [];
        if(open.requesters.indexOf(x) < 0) open.requesters.push(x);
      });
      if(r.note) open.note = (open.note ? open.note + " / " : "") + r.note;
      if(!open.needBy && r.needBy) open.needBy = r.needBy;
      return;
    }
    state.tasks.unshift({
      id:newTaskId(), pzn:pzn, qty:qty, unit:r.unit,
      needBy:r.needBy, mhdMin:r.mhdMin, preferredSupplier:r.preferredSupplier,
      refPrice:r.refPrice, refPriceSource:"manual", requesters:r.requesters,
      orderDate:today, createdAt:now(), stageManual:null, note:r.note, allocs:[]
    });
  });
  ui.staged = kept;
  if(!kept.length){ ui.openNew = false; ui.pasteText = ""; ui.parseErr = ""; }
  commit();
}

  }

    ui.dupPzn = null; ui.formErr = ""; ui.newTab = ui.newTab || "paste";

  }

  if(el.id === "btn-parse"){
    var box = document.getElementById("paste-box");

    var res = parseImport(ui.pasteText);
    ui.parseErr = res.error || "";

  }
  if(el.id === "btn-clear-paste"){ ui.pasteText = ""; ui.staged = []; ui.parseErr = ""; render(); return; }
  if(el.hasAttribute("data-sdrop")){
    ui.staged.splice(Number(el.getAttribute("data-sdrop")), 1); render(); return;
  }
  if(el.hasAttribute("data-schoice")){
    var sc = el.getAttribute("data-schoice").split("|");
    var row = ui.staged[Number(sc[0])];
    if(row) row.choice = row.choice === sc[1] ? null : sc[1];
    render(); return;
  }
  if(el.id === "btn-import"){ doImport(); return; }
  if(el.id === "btn-dict"){
    ui.openDict = true; ui.openNew = false; ui.openId = null; ui.openSuppliers = false;
    ui.dictErr = ""; render(); return;
  }
  if(el.id === "btn-dict-clear"){
    try{ localStorage.removeItem(DICT_KEY); }catch(e){}
    refDict = null; ui.dictErr = ""; render(); return;
  }
  if(el.id === "btn-dict-load"){
    var box = document.getElementById("dict-box");
    var txt = box ? box.value.trim() : "";
    var obj = null;
    try{ obj = JSON.parse(txt); }catch(e){ obj = null; }
    if(!obj || !obj.d || typeof obj.d !== "object"){ ui.dictErr = t("dictBad"); render(); return; }
    try{
      localStorage.setItem(DICT_KEY, JSON.stringify(obj));
      refDict = obj; ui.dictErr = ""; ui.openDict = false;
    }catch(e){
      // 隐私窗口 / 禁用站点数据 / 超配额——不载入，其余功能照常
      refDict = null; ui.dictErr = t("dictNoRoom");
    }
    render(); return;
  }
  if(el.id === "btn-suppliers"){ ui.openSuppliers = true; ui.openNew = false; ui.openId = null; ui.openDict = false; ui.formErr = ""; render(); return; }
  if(el.hasAttribute("data-delsup")){
    if(readOnly) return;
    var gone = el.getAttribute("data-delsup");
    state.suppliers = state.suppliers.filter(function(x){ return x !== gone; });
    ui.formErr = ""; commit(); return;
  }
  if(el.hasAttribute("data-close")){
    ui.openNew = false; ui.openId = null; ui.openSuppliers = false; ui.openDict = false;
    ui.dupPzn = null; ui.formErr = ""; ui.dictErr = ""; saveUI(); render(); return;
  }
  if(el.hasAttribute("data-view")){ ui.view = el.getAttribute("data-view"); saveUI(); render(); return; }
  if(el.hasAttribute("data-filter")){ ui.filter = el.getAttribute("data-filter"); saveUI(); render(); return; }

  if(el.hasAttribute("data-ask")){
    var pa = el.getAttribute("data-ask").split("|");
    var task = findTask(pa[0]); if(!task || readOnly) return;
    task.allocs = task.allocs || [];
    task.allocs.push({id:nextId("A-"), supplier:normSupplier(pa[1]), state:"asked", askedAt:now(),
                      repliedAt:null, qty:null, price:"", eta:"", mhd:"", receivedQty:null, note:"", by:me, updatedAt:now()});
    commit(); return;
  }
  if(el.hasAttribute("data-act")){
    var parts = el.getAttribute("data-act").split("|");
    var act = parts[0], task2 = findTask(parts[1]), a = findAlloc(parts[1], parts[2]);
    if(!task2 || readOnly) return;
    if(act === "delalloc"){
      task2.allocs = task2.allocs.filter(function(x){ return x.id !== parts[2]; });
      commit(); return;
    }
    if(!a) return;
    if(act === "replied"){ a.state = "quoted"; a.repliedAt = now(); }
    else if(act === "choose"){ a.state = "chosen"; if(!a.repliedAt) a.repliedAt = now(); }
    else if(act === "ordered"){ a.state = "ordered"; }
    else if(act === "oos"){ a.state = "oos"; if(!a.repliedAt) a.repliedAt = now(); }
    else if(act === "decline"){ a.state = "declined"; if(!a.repliedAt) a.repliedAt = now(); }
    touch(a); commit(); return;
  }
  if(el.hasAttribute("data-stage")){
    var ps = el.getAttribute("data-stage").split("|");
    var task3 = findTask(ps[0]); if(!task3 || readOnly) return;
    task3.stageManual = ps[1] || null;
    commit(); return;
  }
  if(el.hasAttribute("data-del")){
    var id = el.getAttribute("data-del");
    if(readOnly) return;
    if(ui.confirmDel !== id){ ui.confirmDel = id; render(); return; }
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    ui.confirmDel = null; ui.openId = null; commit(); return;
  }
  if(el.hasAttribute("data-task")){
    ui.openId = el.getAttribute("data-task"); ui.openNew = false; ui.openSuppliers = false; ui.dupPzn = null;
    saveUI(); render(); return;
  }
});

document.addEventListener("submit", function(ev){
  var f = ev.target;
  ev.preventDefault();
  if(readOnly) return;

  if(f.id === "add-supplier"){
    var name = normSupplier(f.sup.value);
    if(!name) return;
    if(state.suppliers.indexOf(name) >= 0){ ui.formErr = t("dupSupplier"); render(); return; }
    state.suppliers.push(name);
    state.suppliers.sort();
    ui.formErr = ""; commit(); return;
  }
  if(f.hasAttribute("data-addsup")){
    var task = findTask(f.getAttribute("data-addsup"));
    var sup = normSupplier(f.sup.value);
    if(!task || !sup) return;
    if(state.suppliers.indexOf(sup) < 0) state.suppliers.push(sup);
    task.allocs = task.allocs || [];
    task.allocs.push({id:nextId("A-"), supplier:sup, state:"asked", askedAt:now(), repliedAt:null,
                      qty:null, price:"", eta:"", mhd:"", receivedQty:null, note:"", by:me, updatedAt:now()});
    commit(); return;
  }
  if(f.hasAttribute("data-alloc")){
    var pr = f.getAttribute("data-alloc").split("|");
    var a = findAlloc(pr[0], pr[1]); if(!a) return;
    a.qty = f.qty.value === "" ? null : Number(f.qty.value);
    a.price = f.price.value.trim();
    a.eta = f.eta.value.trim();
    a.mhd = f.mhd.value.trim();
    a.note = f.note.value.trim();
    if(a.state === "asked" && (a.price || a.qty)){ a.state = "quoted"; a.repliedAt = a.repliedAt || now(); }
    touch(a); commit(); return;
  }
  if(f.id === "new-task"){
    var pzn = normPzn(f.pzn.value);
    var qty = Number(f.qty.value);
    var nameDe = f.nameDe.value.trim(), nameZh = f.nameZh.value.trim();
    ui.formErr = "";
    if(!pzn){ ui.formErr = t("errPzn"); render(); return; }
    if(!(qty > 0)){ ui.formErr = t("errQty"); render(); return; }
    var known = state.products[pzn];
    var ref = lookupRef(pzn);
    if(!known && !ref && !nameDe && !nameZh){ ui.formErr = t("errName"); render(); return; }
    var forced = ev.submitter && ev.submitter.name === "force";
    if(!forced && openRoundFor(pzn)){ ui.dupPzn = pzn; render(); return; }

    if(known){
      if(nameDe) known.nameDe = nameDe;
      if(nameZh) known.nameZh = nameZh;
    }else{
      state.products[pzn] = {pzn:pzn,
        nameDe: nameDe || (ref ? ref.nameDe : ""),
        nameZh: nameZh || (ref ? ref.nameZh : ""), aliases:[]};
    }
    var extra = f.aliases.value.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean);
    extra.forEach(function(s){
      var arr = state.products[pzn].aliases;
      if(arr.indexOf(s) < 0) arr.push(s);
    });
    var today = new Date().toISOString().slice(0, 10);
    state.tasks.unshift({
      id:newTaskId(), pzn:pzn, qty:qty, unit:f.unit.value.trim(),
      needBy:f.needBy.value || "", mhdMin:f.mhdMin.value.trim(),
      preferredSupplier:normSupplier(f.preferredSupplier.value),
      refPrice:f.refPrice.value.trim(), refPriceSource:"manual",
      requesters:f.requesters.value.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean),
      orderDate:today, createdAt:now(), stageManual:null, note:f.note.value.trim(), allocs:[]
    });
    ui.openNew = false; ui.dupPzn = null; ui.formErr = "";
    commit(); return;
  }
});

document.addEventListener("input", function(ev){
  if(ev.target.id === "me-input"){
    me = ev.target.value.trim();
    try{ localStorage.setItem("sb-me", me); }catch(e){}
    return;
  }
  if(ev.target.id === "q-input"){
    ui.q = ev.target.value;
    var pos = ev.target.selectionStart;
    saveUI(); render();
    var again = document.getElementById("q-input");
    if(again){ again.focus(); again.setSelectionRange(pos, pos); }
    return;
  }
  if(ev.target.id === "paste-box"){ ui.pasteText = ev.target.value; return; }
  if(ev.target.hasAttribute && ev.target.hasAttribute("data-srow")){
    var row = ui.staged[Number(ev.target.getAttribute("data-srow"))];
    if(row){
      var fld = ev.target.getAttribute("data-sfield");
      row[fld] = (fld === "aliases" || fld === "requesters") ? toList(ev.target.value)
               : (fld === "preferredSupplier" ? normSupplier(ev.target.value) : ev.target.value);
      if(fld === "pzn") row.choice = null;   // 换了 PZN，之前的并入/另起选择作废
    }
    return;   // 不重渲染，否则每敲一个字符就丢焦点
  }
  // 新建表单里输入 PZN，命中字典就把品名带出来——同一产品只需认一次
  if(ev.target.id === "pzn-input"){
    var p = normPzn(ev.target.value);
    var onBoard = p && state.products[p];
    var hit = onBoard || (p && lookupRef(p));
    var hint = document.getElementById("pzn-hint");
    if(hit){
      var de = document.getElementById("nameDe-input"), zh = document.getElementById("nameZh-input");
      if(de && !de.value) de.value = hit.nameDe || "";
      if(zh && !zh.value) zh.value = hit.nameZh || "";
      if(hint) hint.textContent = onBoard ? t("known") : t("fromDict");
    }else if(hint){
      hint.textContent = "";
    }
  }
});

// 暂存区的字段失焦才重渲染——状态（可导入/缺品名/已有一轮）随之重判
document.addEventListener("change", function(ev){
  if(ev.target.hasAttribute && ev.target.hasAttribute("data-srow")) render();
});

document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape" && (ui.openId || ui.openNew || ui.openSuppliers || ui.openDict)){
    ui.openId = null; ui.openNew = false; ui.openSuppliers = false; ui.openDict = false;
    ui.dupPzn = null; saveUI(); render();
  }
});

render();

/* 计时类文案（「最久一条询价已发出 X」「建了 X 还没发出询价」）每分钟自己走字，
   不用刷新页面。避开三种会打断人的时机：正在保存、正在输入、抽屉开着。 */
setInterval(function(){
  var ae = document.activeElement;
  var typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT");
  if(!typing && !ui.openId && !ui.openNew && !ui.openSuppliers && !ui.openDict) render();
}, 60000);
})();
</script>
